<div style="display: flex; min-height: 100vh; align-items: center; justify-content: center; background-color: #f3f4f6; font-family: system-ui, sans-serif;">
  
  <div style="width: 100%; max-width: 420px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);">
    
    <div style="text-align: center; margin-bottom: 32px;">
      <h2 style="font-size: 28px; font-weight: bold; color: #111827; margin: 0 0 8px 0;">Connexion</h2>
      <p style="color: #6b7280; margin: 0; font-size: 14px;">Accéder à la plateforme Knowledge Hub</p>
    </div>

    @if (errorMessage()) {
      <div style="background-color: #fef2f2; color: #991b1b; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; font-weight: 500; border-left: 4px solid #dc2626;">
        ⚠️ {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="handleLogin()">
      
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px;">Adresse Email</label>
        <input type="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)" required
               style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s;"
               placeholder="nom@entreprise.com">
      </div>

      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px;">Mot de passe</label>
        <input type="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required
               style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 15px;"
               placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="isLoading()"
              style="width: 100%; background-color: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s;">
        {{ isLoading() ? 'Connexion en cours...' : 'Se connecter' }}
      </button>

    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 14px; color: #4b5563;">
      Nouveau sur la plateforme ? 
      <a routerLink="/register" style="color: #2563eb; text-decoration: none; font-weight: 600; margin-left: 4px;">Créer un compte</a>
    </div>

  </div>

</div>
