<div class="shell-container">

  <!-- Mobile/tablet backdrop, shown while the sidebar drawer is open -->
  <div class="mobile-backdrop" [class.visible]="isMobileMenuOpen()" (click)="toggleMobileMenu()"></div>

  <!-- ==================== LEFT BLOCK (SIDEBAR) ==================== -->
  <aside class="left-block" [class.open]="isMobileMenuOpen()">
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>
      </div>
      <div class="brand-title">
        <h2>Knowledge Hub</h2>
        <span class="badge">FLESK Group</span>
      </div>
    </div>

    <div class="tenant-selector">
      <label>Espace de travail</label>
      <div class="tenant-display">{{ tenantName() }}</div>
    </div>

    <nav class="nav-menu">
      <!-- Tableau de bord / Procédures -->
      <a routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="nav-item">
        <span class="nav-active-bar"></span>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="nav-label">Tableau de bord</span>
      </a>

      <!-- Procédures & SOPs -->
      <a routerLink="/dashboard/procedures"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-active-bar"></span>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2Z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        <span class="nav-label">Procédures & SOPs</span>
      </a>

      <!-- Base de connaissances -->
      <a routerLink="/dashboard/knowledge-base"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-active-bar"></span>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        <span class="nav-label">Base de connaissances</span>
      </a>

      <!-- Mes demandes RH -->
      <a routerLink="/dashboard/hr-requests"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-active-bar"></span>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span class="nav-label">Mes demandes RH</span>
      </a>

      <!-- Kaizen / Écarts -->
      @if (canSee(['admin', 'process_owner', 'operator'])) {
      <a routerLink="/dashboard/kaizen"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-active-bar"></span>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
        <span class="nav-label">Kaizen / Écarts</span>
      </a>
      }

      <!-- Espace RH (Admin) -->
      @if (canSee(['hr_admin'])) {
      <a routerLink="/dashboard/hr-admin"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-active-bar"></span>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Espace RH (Admin)</span>
      </a>
      }
    </nav>

    <div class="user-footer">
      <div class="user-avatar">
        {{ initials() }}
        <span class="user-status-dot"></span>
      </div>
      <div class="user-info">
        <p class="user-name">{{ userName() }}</p>
        <p class="user-role">{{ roleLabel() }}</p>
      </div>
      <button type="button" class="logout-btn" (click)="handleLogout()" title="Déconnexion" aria-label="Déconnexion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- ==================== CENTER BLOCK (WORKSPACE) ==================== -->
  <main class="center-block">
    <header class="workspace-header">
      <button type="button" class="menu-toggle-btn" (click)="toggleMobileMenu()" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <!-- Global search replaces the static workspace title in the top nav -->
      <app-global-search class="header-search"></app-global-search>
      <app-notification-center></app-notification-center>
    </header>

    <!-- Routed child views render here (procedures, kaizen, knowledge-base...) -->
    <section class="workspace-content">
      <router-outlet></router-outlet>
    </section>
  </main>

</div>
