<div class="p-6 max-w-5xl mx-auto">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">
        {{ isEditMode ? 'Éditer l\'article' : 'Créer un nouvel article' }}
      </h1>
      <p class="text-sm text-gray-500">
        Publiez des directives, guides d'intégration ou annonces officielles pour l'entreprise.
      </p>
    </div>
    <div class="flex gap-3">
      <button 
        type="button" 
        (click)="onSubmit('draft')" 
        [disabled]="isSubmitting"
        class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
        Enregistrer comme brouillon
      </button>
      <button 
        type="button" 
        (click)="onSubmit('published')" 
        [disabled]="isSubmitting || articleForm.invalid"
        class="px-4 py-2 bg-indigo-600 rounded-lg text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50">
        {{ isSubmitting ? 'Publication...' : 'Publier l\'article' }}
      </button>
    </div>
  </div>

  <!-- Form Body -->
  <form [formGroup]="articleForm" class="space-y-6 bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
    <!-- Title & Category Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Titre de l'article *</label>
        <input 
          type="text" 
          formControlName="title" 
          placeholder="ex: Guide de bienvenue des nouveaux collaborateurs 2026"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie *</label>
        <select 
          formControlName="category" 
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
          <option *ngFor="let cat of categories" [value]="cat.value">
            {{ cat.label }}
          </option>
        </select>
      </div>
    </div>

    <!-- Cover Image URL -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">URL de l'image de couverture</label>
      <input 
        type="url" 
        formControlName="cover_image_url" 
        placeholder="https://images.unsplash.com/photo-..."
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>

    <!-- Summary -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Résumé court</label>
      <textarea 
        formControlName="summary" 
        rows="2" 
        placeholder="Aperçu rapide affiché dans les cartes de la base de connaissances..."
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
    </div>

    <!-- Content -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Contenu de l'article *</label>
      <textarea 
        formControlName="content" 
        rows="12" 
        placeholder="Rédigez votre article ici (supporte le HTML / Markdown)..."
        class="w-full p-4 border rounded-lg font-mono text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
    </div>
  </form>
</div>
