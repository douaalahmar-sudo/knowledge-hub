<div style="display: flex; min-height: 100vh; background-color: #f8fafc; font-family: system-ui, sans-serif;">

  <aside style="width: 280px; background-color: #0f172a; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #1e293b; flex-shrink: 0;">
    
    <div style="padding: 24px 20px;">
      
      <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 24px; border-bottom: 1px solid #1e293b; margin-bottom: 20px;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 24px; height: 24px; color: #3b82f6;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-.778.099-1.533.284-2.253" />
        </svg>
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 0.5px; color: #ffffff;">Knowledge Hub</span>
      </div>
      
      <nav style="display: flex; flex-direction: column; gap: 4px;">
        <a routerLink="/procedures" routerLinkActive="active-link" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.2s, color 0.2s;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 18px; height: 18px; color: #94a3b8;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2Z" />
          </svg>
          <span>Procédures "Zéro Doublon"</span>
        </a>

        <a routerLink="/kaizen" routerLinkActive="active-link" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.2s, color 0.2s;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 18px; height: 18px; color: #94a3b8;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
          </svg>
          <span>Kaizen terrain</span>
        </a>
      </nav>
    </div>

    <div style="padding: 20px 24px; background-color: #0b0f19; border-top: 1px solid #1e293b;">
      <div style="margin-bottom: 16px; padding-left: 4px;">
        <div style="font-size: 14px; font-weight: 600; color: #f9fafb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
          {{ user()?.name || 'Collaborateur' }}
        </div>
        <div style="font-size: 12px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;">
          {{ user()?.email }}
        </div>
      </div>
      
      <button (click)="handleLogout()" 
              style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px; background-color: #dc2626; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 14px;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 16px; height: 16px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
        </svg>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
    
    <header style="background-color: white; padding: 0 32px; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; height: 70px; box-sizing: border-box; flex-shrink: 0;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 600; color: #111827;">Espace Opérationnel</h2>
      
      <div style="display: flex; align-items: center; gap: 6px; background-color: #f0fdf4; color: #166534; padding: 6px 14px; border-radius: 9999px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid #bbf7d0;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 14px; height: 14px; color: #3b82f6;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
        </svg>
        <span>{{ tenant()?.name || 'Tenant inconnu' }}</span>
      </div>
    </header>

    <div style="padding: 32px; flex: 1; overflow-y: auto; box-sizing: border-box; background-color: #f8fafc;">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
