<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aziza Knowledge Hub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E8692A">
  <!-- favicon.ico and apple-touch-icon.png are the real Aziza mark (the gold
       bag), pulled from https://aziza.tn/favicon.ico — the same file the live
       site itself serves as its favicon, at 250x250. That site's own PWA
       manifest (aziza.tn/manifest.webmanifest) points at icon-192/512 that
       turned out to be the unclaimed Angular CLI default icon, not their
       branding, so those were deliberately NOT copied here — see
       manifest.webmanifest's single real-size icon entry instead. No vector
       source was found, so there is no favicon.svg. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
</body>
</html>
